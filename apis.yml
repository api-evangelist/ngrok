aid: ngrok
name: ngrok
description: >-
  ngrok is a unified application delivery network for developers, providing secure tunnels, ingress-as-a-service, API
  gateway, and AI gateway capabilities. It enables developers to expose local services on the public internet, manage
  edge ingress, and route traffic to AI providers without redeploying applications. ngrok provides a unique URL for each
  tunnel, traffic policy controls, and a comprehensive REST API for programmatic management of all resources.
type: Index
accessModel:
  pricing: freemium
  onboarding: self-serve
  trial: false
  try_now: true
  public: false
  label: Freemium · Self-serve signup
  confidence: high
  source:
  - plans
  - authentication
  generated: '2026-07-22'
  method: derived
position: Consumer
access: 3rd-Party
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/ngrok.png
tags:
  - AI Gateway
  - API Gateway
  - Compute
  - Developer Tools
  - Gateways
  - Ingress
  - Platform
  - Proxies
  - Servers
  - Tunnels
