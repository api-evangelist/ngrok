openapi: 3.1.0
info:
  title: Ngrok Abuse Reports SSH Host Certificates API
  description: The ngrok API provides programmatic access to all of ngrok's resources. The API is REST-ish. It follows most of the conventions of a REST API but diverges slightly when the REST model does not fit well. The API listens only on port 443 to help avoid any accidental unencrypted requests. All API access requires an API key.
  version: 2.0.0
  contact:
    name: Ngrok
    url: https://ngrok.com
  license:
    name: Proprietary
    url: https://ngrok.com/tos
servers:
- url: https://api.ngrok.com
  description: Ngrok API Production Server
security:
- bearerAuth: []
- apiKeyAuth: []
tags:
- name: SSH Host Certificates
  description: SSH Host Certificates authenticate ngrok tunnel servers to clients.
paths:
  /ssh_host_certificates:
    post:
      operationId: createSshHostCertificate
      summary: Ngrok Create SSH Host Certificate
      description: Create a new SSH Host Certificate.
      tags:
      - SSH Host Certificates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ssh_certificate_authority_id
              - public_key
              properties:
                ssh_certificate_authority_id:
                  type: string
                public_key:
                  type: string
                principals:
                  type: array
                  items:
                    type: string
                valid_after:
                  type: string
                  format: date-time
                valid_until:
                  type: string
                  format: date-time
                description:
                  type: string
                metadata:
                  type: string
      responses:
        '201':
          description: SSH host certificate created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SshHostCertificate'
    get:
      operationId: listSshHostCertificates
      summary: Ngrok List SSH Host Certificates
      description: List all SSH Host Certificates on this account.
      tags:
      - SSH Host Certificates
      parameters:
      - $ref: '#/components/parameters/BeforeId'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: List of SSH host certificates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SshHostCertificateList'
  /ssh_host_certificates/{id}:
    get:
      operationId: getSshHostCertificate
      summary: Ngrok Get SSH Host Certificate
      description: Get the details of an SSH Host Certificate by ID.
      tags:
      - SSH Host Certificates
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: SSH host certificate details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SshHostCertificate'
    patch:
      operationId: updateSshHostCertificate
      summary: Ngrok Update SSH Host Certificate
      description: Update an SSH Host Certificate by ID.
      tags:
      - SSH Host Certificates
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description:
                  type: string
                metadata:
                  type: string
      responses:
        '200':
          description: SSH host certificate updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SshHostCertificate'
    delete:
      operationId: deleteSshHostCertificate
      summary: Ngrok Delete SSH Host Certificate
      description: Delete an SSH Host Certificate by ID.
      tags:
      - SSH Host Certificates
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: SSH host certificate deleted.
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: A unique identifier for the resource.
    BeforeId:
      name: before_id
      in: query
      required: false
      schema:
        type: string
      description: An ID to use for pagination. Results returned will be before this ID.
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: string
      description: The maximum number of results to return. Maximum is 100.
  schemas:
    SshHostCertificate:
      type: object
      properties:
        id:
          type: string
        uri:
          type: string
        created_at:
          type: string
          format: date-time
        description:
          type: string
        metadata:
          type: string
        public_key:
          type: string
        key_type:
          type: string
        ssh_certificate_authority_id:
          type: string
        principals:
          type: array
          items:
            type: string
        valid_after:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        certificate:
          type: string
    SshHostCertificateList:
      type: object
      properties:
        ssh_host_certificates:
          type: array
          items:
            $ref: '#/components/schemas/SshHostCertificate'
        uri:
          type: string
        next_page_uri:
          type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Use an ngrok API key as a Bearer token. Create API keys from the ngrok dashboard or via the API Keys endpoints.
    apiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
      description: Pass the API key in the Authorization header prefixed with 'Bearer '.
